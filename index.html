<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Dough - Invoice Generator</title>
  
  <!-- Website Favicon Icon -->
  <link rel="icon" type="image/png" href="Gerigi.png" />
  <link rel="shortcut icon" href="Gerigi.png" />
  <link rel="apple-touch-icon" href="Gerigi.png" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @page {
      size: A4 portrait;
      margin: 15mm;
    }

    @media print {
      body {
        background-color: white !important;
        color: black !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      header, button, nav, .print-hidden {
        display: none !important;
      }
      #pdf-invoice-container {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        display: block !important;
      }
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 font-sans antialiased pb-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const getTodayFormatted = () => {
        const today = new Date();
        return today.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
      };

      const getTodayCode = () => {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        return `${year}${month}${day}`;
      };

      // State counter nomor invoice
      const [invoiceCounter, setInvoiceCounter] = useState(() => {
        const savedCounter = localStorage.getItem('dd_invoice_counter');
        const savedDate = localStorage.getItem('dd_invoice_date');
        const todayCode = getTodayCode();
        
        if (savedDate === todayCode && savedCounter) {
          return parseInt(savedCounter, 10);
        }
        return 1;
      });

      // State riwayat transaksi
      const [orderHistory, setOrderHistory] = useState(() => {
        const saved = localStorage.getItem('dd_order_history');
        return saved ? JSON.parse(saved) : [];
      });

      const generateInvoiceNumber = (counterNum) => {
        const todayCode = getTodayCode();
        return `#DD-${todayCode}-${String(counterNum).padStart(3, '0')}`;
      };

      const [rawText, setRawText] = useState(`Halo Daily Dough, saya *Rendy* ingin memesan menu berikut:

1. *Croissant - Smoked Beef & Cheese* (1x) = Rp 20.500
2. *Salt Bread - Milkymond* (2x) = Rp 26.000

*Total Estimasi: Rp 46.500*

_*(Catatan: PO 2-3 hari terhitung setelah konfirmasi pesanan)*_`);

      const [invoiceNumber, setInvoiceNumber] = useState(generateInvoiceNumber(invoiceCounter));
      const [invoiceDate, setInvoiceDate] = useState(getTodayFormatted());
      const [customerName, setCustomerName] = useState('Rendy');
      const [poNote, setPoNote] = useState('PO 2-3 Hari terhitung setelah konfirmasi pesanan');
      const [customerNote, setCustomerNote] = useState('-');
      const [shippingFee, setShippingFee] = useState(0);
      const [discount, setDiscount] = useState(0);
      const [paymentMethod, setPaymentMethod] = useState('Via QRIS');
      const [items, setItems] = useState([
        { id: '1', name: 'Croissant - Smoked Beef & Cheese', qty: 1, price: 20500 },
        { id: '2', name: 'Salt Bread - Milkymond', qty: 2, price: 13000 }
      ]);

      const [copied, setCopied] = useState(false);
      const [sheetsCopied, setSheetsCopied] = useState(false);
      const [activeTab, setActiveTab] = useState('preview');
      
      // State untuk URL Webhook Google Sheets (Default sudah terpasang permanen)
      const DEFAULT_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbzaIPFcLhHsVgYEByokk2oRaZmaNrzwROPbAfOLLTlgRM2m4awXAWq2QoyVEJG-N6wt/exec';
      const [webhookUrl, setWebhookUrl] = useState(() => {
        return localStorage.getItem('dd_sheets_webhook') || DEFAULT_WEBHOOK_URL;
      });
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState(''); // 'success' | 'error' | ''
      const [showWebhookConfig, setShowWebhookConfig] = useState(false);

      // Sync webhook URL ke localStorage
      useEffect(() => {
        localStorage.setItem('dd_sheets_webhook', webhookUrl);
      }, [webhookUrl]);

      // Sync counter & riwayat ke localStorage
      useEffect(() => {
        localStorage.setItem('dd_invoice_counter', invoiceCounter.toString());
        localStorage.setItem('dd_invoice_date', getTodayCode());
      }, [invoiceCounter]);

      useEffect(() => {
        localStorage.setItem('dd_order_history', JSON.stringify(orderHistory));
      }, [orderHistory]);

      const formatIDR = (amount) => {
        return new Intl.NumberFormat('id-ID', {
          style: 'currency',
          currency: 'IDR',
          maximumFractionDigits: 0
        }).format(amount).replace('Rp', 'Rp ');
      };

      const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
      const total = subtotal + Number(shippingFee) - Number(discount);

      const parseWaText = () => {
        if (!rawText.trim()) return;

        let name = 'Pelanggan';
        const nameMatch = rawText.match(/saya\s+\*?([^*]+?)\*?\s+ingin/i) || 
                          rawText.match(/Nama:\s*\*?([^\n*]+)\*?/i) ||
                          rawText.match(/saya\s+([A-Za-z\s]+)\s+ingin/i);
        if (nameMatch && nameMatch[1]) {
          name = nameMatch[1].trim();
        }

        const newItems = [];
        const itemRegex = /(?:\d+\.\s*)?\*?([^*\n\(\)=]+)\*?\s*\(\s*(\d+)x?\s*\)\s*(?:=|-)?\s*(?:Rp)?\s*([\d\.\,]+)/gi;
        let match;

        while ((match = itemRegex.exec(rawText)) !== null) {
          const itemName = match[1].trim();
          const qty = parseInt(match[2], 10) || 1;
          const rawPrice = match[3].replace(/[^\d]/g, '');
          let price = parseInt(rawPrice, 10) || 0;
          
          if (qty > 1 && price > 0 && price % qty === 0 && price > 30000) {
            price = price / qty;
          }

          if (itemName) {
            newItems.push({
              id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
              name: itemName,
              qty: qty,
              price: price
            });
          }
        }

        let custNote = '-';
        const noteMatch = rawText.match(/\*?Catatan Pemesan:\*?\s*([^\n]+)/i) ||
                          rawText.match(/\*?Catatan:\*?\s*([^\n]+)/i);
        if (noteMatch && noteMatch[1] && !noteMatch[1].toLowerCase().includes('po 2-3 hari')) {
          custNote = noteMatch[1].trim();
        }

        setCustomerName(name);
        if (newItems.length > 0) setItems(newItems);
        setCustomerNote(custNote);
      };

      const handleAddItem = () => {
        setItems([
          ...items,
          { id: Date.now().toString(), name: 'Item Baru', qty: 1, price: 10000 }
        ]);
      };

      const handleRemoveItem = (id) => {
        setItems(items.filter((item) => item.id !== id));
      };

      const handleItemChange = (id, field, value) => {
        setItems(
          items.map((item) => {
            if (item.id === id) {
              return {
                ...item,
                [field]: field === 'name' ? value : Math.max(0, Number(value))
              };
            }
            return item;
          })
        );
      };

      // Simpan Pesanan saat ini dan Naikkan Counter Invoice secara Otomatis + Kirim ke Google Sheets
      const handleSaveAndIncrement = async () => {
        const itemSummary = items.map(i => `${i.name} (${i.qty}x)`).join(', ');
        
        const newRecord = {
          noInvoice: invoiceNumber,
          tanggal: invoiceDate,
          nama: customerName,
          rincianMenu: itemSummary,
          subtotal: subtotal,
          ongkir: Number(shippingFee),
          diskon: Number(discount),
          totalBayar: total,
          metode: paymentMethod,
          catatan: customerNote
        };

        // Tambah ke riwayat lokal
        setOrderHistory(prev => [newRecord, ...prev]);

        // Kirim langsung ke Google Sheets jika URL Webhook sudah diatur
        if (webhookUrl && webhookUrl.startsWith('https://script.google.com/')) {
          setIsSyncing(true);
          setSyncStatus('');
          try {
            await fetch(webhookUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(newRecord)
            });
            setSyncStatus('success');
            setTimeout(() => setSyncStatus(''), 4000);
          } catch (error) {
            console.error('Gagal mengirim ke Google Sheets:', error);
            setSyncStatus('error');
          } finally {
            setIsSyncing(false);
          }
        }

        // Naikkan counter urutan invoice
        const nextCounter = invoiceCounter + 1;
        setInvoiceCounter(nextCounter);
        setInvoiceNumber(generateInvoiceNumber(nextCounter));

        // Reset form ringan
        setRawText('');
        setCustomerName('Pelanggan');
        setCustomerNote('-');
        setShippingFee(0);
        setDiscount(0);
      };

      // Copy data format khusus untuk Paste langsung ke Google Sheets (Tab Delimited)
      const handleCopyForSheets = () => {
        if (orderHistory.length === 0) return;

        const headers = ['No Invoice', 'Tanggal', 'Nama Pemesan', 'Rincian Menu', 'Subtotal', 'Ongkir', 'Diskon', 'Total Bayar', 'Metode Pembayaran', 'Catatan'];
        const rows = orderHistory.map(row => [
          row.noInvoice,
          row.tanggal,
          row.nama,
          `"${row.rincianMenu.replace(/"/g, '""')}"`,
          row.subtotal,
          row.ongkir,
          row.diskon,
          row.totalBayar,
          row.metode,
          `"${row.catatan.replace(/"/g, '""')}"`
        ].join('\t'));

        const tsvContent = [headers.join('\t'), ...rows].join('\n');
        navigator.clipboard.writeText(tsvContent);
        setSheetsCopied(true);
        setTimeout(() => setSheetsCopied(false), 2500);
      };

      // Export CSV File untuk di-import ke Google Sheets / Excel
      const handleDownloadCSV = () => {
        if (orderHistory.length === 0) return;

        const headers = ['No Invoice', 'Tanggal', 'Nama Pemesan', 'Rincian Menu', 'Subtotal', 'Ongkir', 'Diskon', 'Total Bayar', 'Metode Pembayaran', 'Catatan'];
        const rows = orderHistory.map(row => [
          row.noInvoice,
          row.tanggal,
          row.nama,
          `"${row.rincianMenu.replace(/"/g, '""')}"`,
          row.subtotal,
          row.ongkir,
          row.diskon,
          row.totalBayar,
          row.metode,
          `"${row.catatan.replace(/"/g, '""')}"`
        ].join(','));

        const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `DailyDough_Rekapan_${getTodayCode()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const generateWaString = () => {
        const combinedNotes = [
          poNote ? `Catatan: ${poNote}` : '',
          customerNote ? `Note: ${customerNote}` : ''
        ].filter(Boolean).join(' | ');

        const itemList = items
          .map(
            (item, idx) =>
              `${idx + 1}. ${item.name} (${item.qty}x) - Rp ${item.price.toLocaleString('id-ID')}`
          )
          .join('\n');

        return `🧾 *INVOICE PEMBAYARAN - DAILY DOUGH*
No. Pesanan: ${invoiceNumber}
Tanggal: ${invoiceDate}

*Detail Pemesan:*
Nama: Kak ${customerName}
${combinedNotes ? `${combinedNotes}\n` : ''}
----------------------------------
*Rincian Pesanan:*
${itemList}

Subtotal: Rp ${subtotal.toLocaleString('id-ID')}
Ongkir: Rp ${Number(shippingFee).toLocaleString('id-ID')}
Diskon: ${discount > 0 ? `-Rp ${Number(discount).toLocaleString('id-ID')}` : 'Rp 0'}
----------------------------------
*TOTAL PEMBAYARAN: Rp ${total.toLocaleString('id-ID')}*

*Pembayaran:*
${paymentMethod}

Mohon kirimkan bukti transfer ke WA ini ya Kak. Terima kasih! 🙏✨`;
      };

      const handleCopyText = () => {
        navigator.clipboard.writeText(generateWaString());
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const handleDownloadPdf = () => {
        setActiveTab('pdf');
        setTimeout(() => {
          window.print();
        }, 150);
      };

      return (
        <div>
          {/* Header */}
          <header className="bg-amber-950 text-amber-50 shadow-md sticky top-0 z-30 print-hidden">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex flex-col justify-center py-2">
                <h1 
                  className="text-3xl text-amber-50 tracking-tight leading-none" 
                  style={{ fontFamily: '"Playfair Display", Georgia, serif', fontWeight: 700, letterSpacing: '-0.02em' }}
                >
                  Daily Dough
                </h1>
                <p 
                  className="text-sm text-amber-200/90 mt-1" 
                  style={{ fontFamily: '"Playfair Display", Georgia, serif', fontStyle: 'italic' }}
                >
                  A Little Joy in Every Bite
                </p>
              </div>
              <div className="flex space-x-2">
                <button
                  onClick={handleDownloadPdf}
                  className="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm cursor-pointer active:scale-95"
                >
                  Simpan PDF
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              {/* Left Column Controls */}
              <div className="lg:col-span-5 space-y-6 print-hidden">
                <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-5">
                  <h2 className="text-base font-semibold text-amber-950 mb-3">1. Paste Chat WhatsApp Pesanan</h2>
                  <textarea
                    rows="4"
                    value={rawText}
                    onChange={(e) => setRawText(e.target.value)}
                    className="w-full text-xs font-mono p-3 bg-stone-50 border border-stone-200 rounded-lg focus:ring-2 focus:ring-amber-600 outline-none"
                  ></textarea>
                  <button
                    onClick={parseWaText}
                    className="mt-3 w-full bg-amber-900 hover:bg-amber-950 text-amber-100 py-2 px-4 rounded-lg text-sm font-medium transition"
                  >
                    Proses & Extract Text Pesanan
                  </button>
                </div>

                <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-5 space-y-4">
                  <div className="flex justify-between items-center border-b pb-2">
                    <h2 className="text-base font-semibold text-amber-950">2. Edit Detail Invoice</h2>
                    <span className="text-xs font-mono bg-amber-100 text-amber-900 font-bold px-2 py-0.5 rounded">
                      Auto #{String(invoiceCounter).padStart(3, '0')}
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-stone-600 mb-1">No. Invoice (Otomatis)</label>
                      <input type="text" value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} className="w-full text-xs p-2 border rounded font-mono font-bold bg-amber-50/50" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-stone-600 mb-1">Nama Pemesan</label>
                      <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full text-xs p-2 border rounded font-medium" />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-stone-600 mb-1">Estimasi PO</label>
                      <input type="text" value={poNote} onChange={(e) => setPoNote(e.target.value)} className="w-full text-xs p-2 border rounded" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-stone-600 mb-1">Catatan Tambahan</label>
                      <input type="text" value={customerNote} onChange={(e) => setCustomerNote(e.target.value)} placeholder="Contoh: -" className="w-full text-xs p-2 border rounded" />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between mb-2">
                      <label className="text-xs font-semibold">Daftar Menu</label>
                      <button onClick={handleAddItem} className="text-xs text-amber-700 font-medium">+ Tambah Item</button>
                    </div>
                    <div className="space-y-2 max-h-56 overflow-y-auto">
                      {items.map((item) => (
                        <div key={item.id} className="flex gap-2 bg-stone-50 p-2 rounded border border-stone-200">
                          <input type="text" value={item.name} onChange={(e) => handleItemChange(item.id, 'name', e.target.value)} className="flex-1 text-xs p-1 border rounded bg-white" />
                          <input type="number" min="1" value={item.qty} onChange={(e) => handleItemChange(item.id, 'qty', e.target.value)} className="w-12 text-xs p-1 border rounded text-center" />
                          <input type="number" min="0" step="500" value={item.price} onChange={(e) => handleItemChange(item.id, 'price', e.target.value)} className="w-24 text-xs p-1 border rounded text-right" />
                          <button onClick={() => handleRemoveItem(item.id)} className="text-red-500 text-xs px-1">✕</button>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 border-t pt-3">
                    <div>
                      <label className="block text-xs text-stone-600 mb-1">Ongkir (Rp)</label>
                      <input type="number" value={shippingFee} onChange={(e) => setShippingFee(e.target.value)} className="w-full text-xs p-2 border rounded" />
                    </div>
                    <div>
                      <label className="block text-xs text-stone-600 mb-1">Diskon (Rp)</label>
                      <input type="number" value={discount} onChange={(e) => setDiscount(e.target.value)} className="w-full text-xs p-2 border rounded" />
                    </div>
                  </div>

                  {/* Action Tombol Selesai & Increment */}
                  <div className="border-t pt-3 space-y-2">
                    <button
                      onClick={handleSaveAndIncrement}
                      disabled={isSyncing}
                      className="w-full bg-emerald-700 hover:bg-emerald-800 disabled:bg-emerald-400 text-white font-medium py-2.5 px-4 rounded-lg text-xs shadow-sm transition active:scale-95 flex items-center justify-center gap-2"
                    >
                      {isSyncing ? '⏳ Mengirim ke Google Sheets...' : '✓ Selesaikan, Kirim ke Sheets & Lanjut (+1)'}
                    </button>
                    {syncStatus === 'success' && (
                      <p className="text-[11px] text-emerald-700 font-medium text-center bg-emerald-50 py-1 rounded border border-emerald-200">
                        ✅ Data berhasil masuk ke Google Sheets!
                      </p>
                    )}
                    {syncStatus === 'error' && (
                      <p className="text-[11px] text-red-600 font-medium text-center bg-red-50 py-1 rounded border border-red-200">
                        ⚠️ Gagal kirim otomatis, data tersimpan di riwayat lokal.
                      </p>
                    )}
                  </div>
                </div>

                {/* Google Sheets Sync Box */}
                <div className="bg-amber-50/80 rounded-xl shadow-sm border border-amber-200 p-5 space-y-3">
                  <div className="flex justify-between items-center">
                    <h2 className="text-sm font-bold text-amber-950 flex items-center gap-1.5">
                      📊 Integrasi Google Sheets ({orderHistory.length} Pesanan)
                    </h2>
                    <button
                      onClick={() => setShowWebhookConfig(!showWebhookConfig)}
                      className="text-xs text-amber-800 underline font-medium hover:text-amber-950"
                    >
                      {showWebhookConfig ? 'Tutup Pengaturan' : (webhookUrl ? '⚙️ Terhubung' : '⚙️ Atur Link Sheets')}
                    </button>
                  </div>

                  {showWebhookConfig && (
                    <div className="bg-white p-3 rounded-lg border border-amber-200 space-y-2">
                      <label className="block text-[11px] font-semibold text-stone-700">
                        URL Web App Google Apps Script:
                      </label>
                      <input
                        type="url"
                        value={webhookUrl}
                        onChange={(e) => setWebhookUrl(e.target.value)}
                        placeholder="https://script.google.com/macros/s/.../exec"
                        className="w-full text-xs p-2 border border-stone-300 rounded focus:ring-2 focus:ring-amber-600 outline-none font-mono"
                      />
                      <p className="text-[10px] text-stone-500 leading-relaxed">
                        Tempel URL Web App dari Google Apps Script di sini agar setiap pesanan otomatis masuk baris baru di Google Sheets.
                      </p>
                    </div>
                  )}

                  <p className="text-xs text-stone-600">
                    {webhookUrl 
                      ? '🟢 Mode Auto-Sync Aktif: Pesanan otomatis masuk ke Google Sheets saat tombol Selesaikan ditekan.' 
                      : 'Klik "Atur Link Sheets" di kanan atas kotak ini untuk menghubungkan langsung ke Spreadsheet kamu.'}
                  </p>
                  <div className="flex gap-2 pt-1">
                    <button
                      onClick={handleCopyForSheets}
                      disabled={orderHistory.length === 0}
                      className={`flex-1 text-xs py-2 px-3 rounded-lg font-medium transition ${
                        orderHistory.length === 0
                          ? 'bg-stone-200 text-stone-400 cursor-not-allowed'
                          : sheetsCopied
                          ? 'bg-emerald-600 text-white'
                          : 'bg-amber-900 text-amber-50 hover:bg-amber-950'
                      }`}
                    >
                      {sheetsCopied ? 'Tersalin!' : 'Salin Manual'}
                    </button>
                    <button
                      onClick={handleDownloadCSV}
                      disabled={orderHistory.length === 0}
                      className={`text-xs py-2 px-3 rounded-lg font-medium transition ${
                        orderHistory.length === 0
                          ? 'bg-stone-200 text-stone-400 cursor-not-allowed'
                          : 'bg-stone-800 text-white hover:bg-stone-900'
                      }`}
                    >
                      Download CSV
                    </button>
                  </div>
                </div>

              </div>

              {/* Right Column Preview */}
              <div className="lg:col-span-7 space-y-4">
                <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-2 flex justify-between items-center print-hidden">
                  <div className="flex space-x-2">
                    <button onClick={() => setActiveTab('preview')} className={`px-4 py-2 rounded-lg text-xs font-semibold ${activeTab === 'preview' ? 'bg-amber-900 text-white' : 'text-stone-600'}`}>
                      Teks WhatsApp
                    </button>
                    <button onClick={() => setActiveTab('pdf')} className={`px-4 py-2 rounded-lg text-xs font-semibold ${activeTab === 'pdf' ? 'bg-amber-900 text-white' : 'text-stone-600'}`}>
                      Preview Dokumen
                    </button>
                  </div>
                  {activeTab === 'preview' ? (
                    <button onClick={handleCopyText} className="px-3 py-1.5 rounded text-xs font-medium bg-emerald-600 text-white">
                      {copied ? 'Tersalin!' : 'Salin Pesan WA'}
                    </button>
                  ) : (
                    <button onClick={handleDownloadPdf} className="px-3 py-1.5 rounded text-xs font-medium bg-emerald-600 text-white">
                      Simpan PDF
                    </button>
                  )}
                </div>

                {activeTab === 'preview' && (
                  <div className="bg-stone-900 rounded-xl shadow-lg p-6 text-stone-100 font-mono text-sm leading-relaxed whitespace-pre-wrap print-hidden">
                    {generateWaString()}
                  </div>
                )}

                <div id="invoice-card-frame" className={`bg-white rounded-xl shadow-md border border-stone-200 p-8 max-w-2xl mx-auto ${activeTab !== 'pdf' ? 'hidden print:block' : 'block'}`}>
                  <div id="pdf-invoice-container">
                    <div className="flex justify-between items-start border-b-2 border-stone-200 pb-6 mb-6">
                      <div>
                        <h1 className="text-4xl text-stone-900" style={{ fontFamily: '"Playfair Display", Georgia, serif', fontWeight: 700 }}>
                          Daily Dough
                        </h1>
                        <p className="text-base text-stone-600 mt-1" style={{ fontFamily: '"Playfair Display", Georgia, serif', fontStyle: 'italic' }}>
                          A Little Joy in Every Bite
                        </p>
                      </div>
                      <div className="flex flex-col items-end text-right">
                        <div style={{
                          display: 'table',
                          backgroundColor: '#78350f',
                          color: '#ffffff',
                          borderRadius: '6px',
                          padding: '0 12px',
                          height: '24px',
                          marginBottom: '6px'
                        }}>
                          <span style={{
                            display: 'table-cell',
                            verticalAlign: 'middle',
                            textAlign: 'center',
                            fontSize: '11px',
                            fontWeight: 'bold',
                            letterSpacing: '0.05em',
                            color: '#ffffff',
                            lineHeight: '1'
                          }}>
                            INVOICE
                          </span>
                        </div>
                        <p className="text-sm font-bold text-stone-800 m-0 leading-snug">{invoiceNumber}</p>
                        <p className="text-xs text-stone-500 m-0 leading-tight mt-0.5">{invoiceDate}</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4 mb-6 bg-stone-50 p-4 rounded border">
                      <div>
                        <p className="text-xs font-semibold text-stone-400 uppercase">Diterbitkan Untuk</p>
                        <p className="text-sm font-bold text-stone-800 mt-0.5">Kak {customerName}</p>
                      </div>
                      <div>
                        <p className="text-xs font-semibold text-stone-400 uppercase">Status & Catatan</p>
                        <p className="text-xs text-stone-700 mt-0.5">
                          {poNote && <span>• {poNote}<br/></span>}
                          {customerNote && <span>• Note: {customerNote}</span>}
                        </p>
                      </div>
                    </div>

                    <table className="w-full text-left mb-6 border-collapse">
                      <thead>
                        <tr className="border-b text-xs text-stone-500 uppercase">
                          <th className="py-2">Item Menu</th>
                          <th className="py-2 text-center">Qty</th>
                          <th className="py-2 text-right">Harga Satuan</th>
                          <th className="py-2 text-right">Total</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-100 text-xs">
                        {items.map((item) => (
                          <tr key={item.id}>
                            <td className="py-3 font-medium text-stone-800">{item.name}</td>
                            <td className="py-3 text-center">{item.qty}x</td>
                            <td className="py-3 text-right">{formatIDR(item.price)}</td>
                            <td className="py-3 text-right font-medium">{formatIDR(item.qty * item.price)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>

                    <div className="flex justify-end border-t pt-4 mb-8">
                      <div className="w-1/2 space-y-2 text-xs">
                        <div className="flex justify-between text-stone-600"><span>Subtotal:</span><span>{formatIDR(subtotal)}</span></div>
                        {Number(shippingFee) > 0 && <div className="flex justify-between text-stone-600"><span>Ongkos Kirim:</span><span>{formatIDR(shippingFee)}</span></div>}
                        {Number(discount) > 0 && <div className="flex justify-between text-emerald-700 font-medium"><span>Diskon:</span><span>-{formatIDR(discount)}</span></div>}
                        <div className="flex justify-between text-sm font-bold border-t pt-2 text-amber-950">
                          <span>Total Pembayaran:</span><span>{formatIDR(total)}</span>
                        </div>
                      </div>
                    </div>

                    <div className="border-t border-dashed pt-4 flex justify-between items-end text-xs">
                      <div>
                        <p className="font-semibold">Pembayaran:</p>
                        <p className="text-stone-600">{paymentMethod}</p>
                      </div>
                      <p className="text-stone-400 italic">Terima kasih atas pesanan Anda! 🙏✨</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
